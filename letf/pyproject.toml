[project]
name = "letf-lab"
version = "0.1.0"
description = "Motor de Research by BiVelio para ETFs apalancados: simulador, backtests y líneas de investigación de los artículos"
license = { text = "Todos los derechos reservados (BiVelio Inc). Código visible para verificar; sin licencia de uso." }
authors = [{ name = "BiVelio Inc" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "yfinance>=0.2.50",
    "matplotlib>=3.8",
    "scipy>=1.12",
    "tabulate>=0.9",
    "scikit-learn>=1.4",
    "xlrd>=2.0",
]

[project.optional-dependencies]
ib = ["ib_async>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["letf_lab"]
